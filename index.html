<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OncoWordle</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>OncoWordle</h1>
    </header>
    
    <div class="game-area">
      <div class="input-row">
        <div class="guess-input-container">
          <input type="text" id="guess-input" placeholder="Enter cancer type..." autocomplete="off">
          <div id="autocomplete-list" class="autocomplete-list"></div>
        </div>
        <button id="submit-btn">Submit</button>
      </div>
      <p class="attempts-remaining">Attempts remaining: <span id="attempts">6</span></p>
    </div>
    
    <hr class="divider">
    
    <section class="profile-section">
      <h2>Top Mutated Genes</h2>
      <div class="tag-container" id="mutations-container"></div>
    </section>
    
    <section class="profile-section">
      <h2>Copy Number Alterations</h2>
      <div class="cnv-grid">
        <div class="cnv-column">
          <h3>Amplifications</h3>
          <div class="tag-container" id="amplifications-container"></div>
        </div>
        <div class="cnv-column">
          <h3>Deletions</h3>
          <div class="tag-container" id="deletions-container"></div>
        </div>
      </div>
    </section>
    
    <div class="bottom-row">
      <section class="clinical-box">
        <h2>Clinical Characteristics</h2>
        <ul id="clinical-list"></ul>
      </section>
      
      <figure class="histology-box">
        <img id="histology-img" src="" alt="Histology image">
        <figcaption id="histology-caption"></figcaption>
      </figure>
    </div>
    
    <hr class="divider">
    
    <section class="guess-history">
      <h2>Previous Guesses</h2>
      <ol id="guess-list"></ol>
    </section>
    
    <div id="game-result" class="game-result"></div>
    
    <button id="new-game-btn" class="new-game-btn hidden">New Game</button>
  </div>
  
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
