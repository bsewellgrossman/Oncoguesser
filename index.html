<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoWordle - Cancer Genomics Guessing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .game-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .profile-section {
            margin-bottom: 20px;
        }

        .profile-section h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .histology-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .histology-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .histology-caption {
            color: #888;
            font-size: 0.85rem;
            margin-top: 8px;
            font-style: italic;
        }

        .gene-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .gene-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .gene-tag.amplification {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .gene-tag.deletion {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .clinical-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .clinical-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .clinical-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .clinical-card .label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .guess-section {
            margin-top: 25px;
        }

        .input-container {
            position: relative;
            display: flex;
            gap: 10px;
        }

        #guessInput {
            flex: 1;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #333;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        #guessInput:focus {
            border-color: #00d4ff;
        }

        #guessInput:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 70px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 0 0 10px 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .autocomplete-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .autocomplete-item:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        #submitGuess {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            color: #1a1a2e;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #submitGuess:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        #submitGuess:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .guesses-container {
            margin-top: 20px;
        }

        .guess-row {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-weight: 500;
        }

        .guess-row.wrong {
            background: rgba(255, 71, 87, 0.3);
            border-left: 4px solid #ff4757;
        }

        .guess-row.correct {
            background: rgba(0, 255, 136, 0.3);
            border-left: 4px solid #00ff88;
        }

        .attempts-counter {
            text-align: center;
            margin-top: 15px;
            color: #888;
        }

        .message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .message.win {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .message.lose {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .new-game-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .new-game-btn:hover {
            transform: translateY(-2px);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-item .label {
            font-size: 0.75rem;
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff4757;
        }

        .frequency {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .image-loading {
            color: #888;
            font-style: italic;
            padding: 20px;
        }

        .image-error {
            color: #ff4757;
            font-size: 0.9rem;
            padding: 10px;
        }
    </style>
</head>

                    { gene: "TP53", frequency: "18.2" },
                    { gene: "ARID1A", frequency: "15.5" },
                    { gene: "BAP1", frequency: "12.8" },
                    { gene: "PBRM1", frequency: "10.2" },
                    { gene: "SMAD4", frequency: "8.5" },
                    { gene: "IDH2", frequency: "6.2" },
                    { gene: "EPHA2", frequency: "5.5" },
                    { gene: "PIK3CA", frequency: "4.8" }
                ],
                cnv: {
                    amplifications: [
                        { gene: "ERBB2", frequency: "12.5" },
                        { gene: "MCL1", frequency: "8.8" },
                        { gene: "MDM2", frequency: "6.2" },
                        { gene: "MYC", frequency: "5.5" },
                        { gene: "CCND1", frequency: "4.2" }
                    ],
                    deletions: [
                        { gene: "CDKN2A", frequency: "22.5" },
                        { gene: "BAP1", frequency: "15.8" },
                        { gene: "PBRM1", frequency: "12.2" },
                        { gene: "ARID1A", frequency: "8.5" },
                        { gene: "SMAD4", frequency: "6.8" }
                    ]
                },
                clinical: {
                    medianAge: 63,
                    malePercent: 45,
                    femalePercent: 55,
                    medianTMB: 1.3
                }
            },
            "Adrenocortical Carcinoma": {
                displayName: "Adrenocortical Carcinoma",
                studyId: "acc_tcga",
                sampleCount: 92,
                histologyImage: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Adrenal_cortical_carcinoma_-_high_mag.jpg/512px-Adrenal_cortical_carcinoma_-_high_mag.jpg",
                histologyCaption: "Adrenocortical carcinoma - H&E stain",
                mutations: [
                    { gene: "TP53", frequency: "18.5" },
                    { gene: "CTNNB1", frequency: "15.2" },
                    { gene: "ZNRF3", frequency: "12.8" },
                    { gene: "PRKAR1A", frequency: "8.5" },
                    { gene: "MEN1", frequency: "6.2" },
                    { gene: "DAXX", frequency: "5.5" },
                    { gene: "TERT", frequency: "4.8" },
                    { gene: "RB1", frequency: "4.2" },
                    { gene: "APC", frequency: "3.5" },
                    { gene: "MED12", frequency: "2.8" }
                ],
                cnv: {
                    amplifications: [
                        { gene: "TERT", frequency: "18.5" },
                        { gene: "CDK4", frequency: "12.2" },
                        { gene: "MDM2", frequency: "8.5" },
                        { gene: "MYC", frequency: "6.8" },
                        { gene: "CCNE1", frequency: "5.2" }
                    ],
                    deletions: [
                        { gene: "CDKN2A", frequency: "25.8" },
                        { gene: "RB1", frequency: "15.2" },
                        { gene: "ZNRF3", frequency: "12.5" },
                        { gene: "TP53", frequency: "10.8" },
                        { gene: "DAXX", frequency: "6.2" }
                    ]
                },
                clinical: {
                    medianAge: 47,
                    malePercent: 35,
                    femalePercent: 65,
                    medianTMB: 1.8
                }
            },
            "Pheochromocytoma": {
                displayName: "Pheochromocytoma",
                studyId: "pcpg_tcga",
                sampleCount: 179,
                histologyImage: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Pheochromocytoma_high_mag.jpg/512px-Pheochromocytoma_high_mag.jpg",
                histologyCaption: "Pheochromocytoma - H&E stain",
                mutations: [
                    { gene: "HRAS", frequency: "8.5" },
                    { gene: "RET", frequency: "6.2" },
                    { gene: "VHL", frequency: "5.5" },
                    { gene: "NF1", frequency: "4.8" },
                    { gene: "EPAS1", frequency: "4.2" },
                    { gene: "ATRX", frequency: "3.8" },
                    { gene: "CSDE1", frequency: "3.2" },
                    { gene: "TP53", frequency: "2.5" },
                    { gene: "MEN1", frequency: "2.2" },
                    { gene: "SDHB", frequency: "1.8" }
                ],
                cnv: {
                    amplifications: [
                        { gene: "MDM2", frequency: "5.2" },
                        { gene: "TERT", frequency: "4.5" },
                        { gene: "MYC", frequency: "3.8" },
                        { gene: "CCND1", frequency: "2.5" },
                        { gene: "CDK4", frequency: "2.2" }
                    ],
                    deletions: [
                        { gene: "VHL", frequency: "12.5" },
                        { gene: "CDKN2A", frequency: "8.8" },
                        { gene: "SDHB", frequency: "6.5" },
                        { gene: "NF1", frequency: "5.2" },
                        { gene: "ATRX", frequency: "4.5" }
                    ]
                },
                clinical: {
                    medianAge: 47,
                    malePercent: 43,
                    femalePercent: 57,
                    medianTMB: 0.6
                }
            }
        };

        const CANCER_TYPES = Object.keys(CANCER_DATA);
        const MAX_ATTEMPTS = 6;

        let currentCancer = null;
        let guesses = [];
        let gameOver = false;
        let stats = loadStats();

        function loadStats() {
            const saved = localStorage.getItem('oncowordle_stats_v3');
            if (saved) {
                return JSON.parse(saved);
            }
            return {
                played: 0,
                won: 0,
                currentStreak: 0,
                maxStreak: 0
            };
        }

        function saveStats() {
            localStorage.setItem('oncowordle_stats_v3', JSON.stringify(stats));
        }

        function updateStatsDisplay() {
            document.getElementById('gamesPlayed').textContent = stats.played;
            document.getElementById('gamesWon').textContent = stats.won;
            document.getElementById('winPercent').textContent = stats.played > 0 
                ? Math.round((stats.won / stats.played) * 100) + '%' 
                : '0%';
            document.getElementById('currentStreak').textContent = stats.currentStreak;
        }

        function getRandomCancer() {
            const index = Math.floor(Math.random() * CANCER_TYPES.length);
            return CANCER_TYPES[index];
        }

        function renderGame() {
            const data = CANCER_DATA[currentCancer];
            
            const html = `
                <div class="game-area">
                    <div class="profile-section">
                        <h3>🔬 Histology</h3>
                        <div class="histology-container">
                            <img src="${data.histologyImage}" 
                                 alt="Histology image" 
                                 class="histology-image"
                                 onerror="this.onerror=null; this.src=''; this.alt='Image not available'; this.style.display='none'; this.parentNode.innerHTML='<p class=\\'image-error\\'>Histology image not available</p>';">
                            <p class="histology-caption">${data.histologyCaption}</p>
                        </div>
                    </div>

                    <div class="profile-section">
                        <h3>🧬 Top Mutated Genes</h3>
                        <div class="gene-list">
                            ${data.mutations.map(m => `
                                <span class="gene-tag">${m.gene} <span class="frequency">(${m.frequency}%)</span></span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="profile-section">
                        <h3>📈 Copy Number Amplifications</h3>
                        <div class="gene-list">
                            ${data.cnv.amplifications.map(a => `
                                <span class="gene-tag amplification">${a.gene} <span class="frequency">(${a.frequency}%)</span></span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="profile-section">
                        <h3>📉 Copy Number Deletions</h3>
                        <div class="gene-list">
                            ${data.cnv.deletions.map(d => `
                                <span class="gene-tag deletion">${d.gene} <span class="frequency">(${d.frequency}%)</span></span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="profile-section">
                        <h3>📊 Clinical Characteristics</h3>
                        <div class="clinical-grid">
                            <div class="clinical-card">
                                <div class="value">${data.clinical.medianAge}</div>
                                <div class="label">Median Age at Diagnosis</div>
                            </div>
                            <div class="clinical-card">
                                <div class="value">${data.clinical.malePercent}% / ${data.clinical.femalePercent}%</div>
                                <div class="label">Male / Female</div>
                            </div>
                            <div class="clinical-card">
                                <div class="value">${data.clinical.medianTMB}</div>
                                <div class="label">Median TMB (mut/Mb)</div>
                            </div>
                            <div class="clinical-card">
                                <div class="value">${data.sampleCount}</div>
                                <div class="label">Sample Count</div>
                            </div>
                        </div>
                    </div>

                    <div class="guess-section">
                        <div class="input-container">
                            <input type="text" id="guessInput" placeholder="Type a cancer type..." autocomplete="off" ${gameOver ? 'disabled' : ''}>
                            <div class="autocomplete-dropdown" id="autocomplete"></div>
                            <button id="submitGuess" ${gameOver ? 'disabled' : ''}>Guess</button>
                        </div>
                        
                        <div class="guesses-container" id="guessesContainer">
                            ${guesses.map(g => `
                                <div class="guess-row ${g.correct ? 'correct' : 'wrong'}">
                                    ${g.correct ? '✅' : '❌'} ${g.guess} ${g.correct ? '- Correct!' : '- Wrong'}
                                </div>
                            `).join('')}
                        </div>

                        <div class="attempts-counter">
                            Attempts: ${guesses.length} / ${MAX_ATTEMPTS}
                        </div>

                        ${gameOver ? `
                            <div class="message ${guesses[guesses.length - 1]?.correct ? 'win' : 'lose'}">
                                ${guesses[guesses.length - 1]?.correct 
                                    ? '🎉 Congratulations! You got it!' 
                                    : `😔 The answer was: ${currentCancer}`}
                            </div>
                            <button class="new-game-btn" onclick="startNewGame()">Play Again</button>
                        ` : ''}
                    </div>
                </div>
            `;

            document.getElementById('gameContent').innerHTML = html;
            
            if (!gameOver) {
                setupAutocomplete();
                setupEventListeners();
            }
        }

        function setupAutocomplete() {
            const input = document.getElementById('guessInput');
            const dropdown = document.getElementById('autocomplete');

            input.addEventListener('input', () => {
                const value = input.value.toLowerCase();
                if (value.length < 2) {
                    dropdown.style.display = 'none';
                    return;
                }

                const matches = CANCER_TYPES.filter(c => 
                    c.toLowerCase().includes(value) && 
                    !guesses.some(g => g.guess === c)
                );

                if (matches.length > 0) {
                    dropdown.innerHTML = matches.map(m => 
                        `<div class="autocomplete-item" data-value="${m}">${m}</div>`
                    ).join('');
                    dropdown.style.display = 'block';

                    dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
                        item.addEventListener('click', () => {
                            input.value = item.dataset.value;
                            dropdown.style.display = 'none';
                        });
                    });
                } else {
                    dropdown.style.display = 'none';
                }
            });

            input.addEventListener('blur', () => {
                setTimeout(() => dropdown.style.display = 'none', 200);
            });
        }

        function setupEventListeners() {
            const input = document.getElementById('guessInput');
            const submitBtn = document.getElementById('submitGuess');

            submitBtn.addEventListener('click', submitGuess);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitGuess();
            });
        }

        function submitGuess() {
            const input = document.getElementById('guessInput');
            const guess = input.value.trim();

            if (!guess) return;

            // Check if it's a valid cancer type
            const matchedCancer = CANCER_TYPES.find(c => 
                c.toLowerCase() === guess.toLowerCase()
            );

            if (!matchedCancer) {
                alert('Please select a valid cancer type from the list.');
                return;
            }

            // Check if already guessed
            if (guesses.some(g => g.guess.toLowerCase() === matchedCancer.toLowerCase())) {
                alert('You already guessed that!');
                return;
            }

            const isCorrect = matchedCancer === currentCancer;
            guesses.push({ guess: matchedCancer, correct: isCorrect });

            if (isCorrect) {
                gameOver = true;
                stats.played++;
                stats.won++;
                stats.currentStreak++;
                if (stats.currentStreak > stats.maxStreak) {
                    stats.maxStreak = stats.currentStreak;
                }
                saveStats();
            } else if (guesses.length >= MAX_ATTEMPTS) {
                gameOver = true;
                stats.played++;
                stats.currentStreak = 0;
                saveStats();
            }

            updateStatsDisplay();
            renderGame();
        }

        function startNewGame() {
            currentCancer = getRandomCancer();
            guesses = [];
            gameOver = false;
            renderGame();
        }

        // Initialize
        updateStatsDisplay();
        startNewGame();
    </script>
</body>
</html>
