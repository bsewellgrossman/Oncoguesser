<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoWordle - API Test</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            line-height: 1.6;
        }
        .success { color: #4ecdc4; }
        .error { color: #ff6b6b; }
        .info { color: #00d4ff; }
        pre {
            background: #000;
            padding: 10px;
            overflow-x: auto;
            max-height: 200px;
            overflow-y: auto;
        }
        button {
            background: #00d4ff;
            border: none;
            padding: 10px 20px;
            color: #000;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        #log {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🧬 OncoWordle - API Diagnostic Test</h1>
    <p>This will test connectivity to cBioPortal API and show exactly what's happening.</p>
    
    <button onclick="runTests()">Run API Tests</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div id="log"></div>

    <script>
        const API_BASE = 'https://www.cbioportal.org/api';
        const logDiv = document.getElementById('log');

        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function logData(label, data) {
            const pre = document.createElement('pre');
            pre.textContent = `${label}:\n${JSON.stringify(data, null, 2)}`;
            logDiv.appendChild(pre);
        }

        function clearLog() {
            logDiv.innerHTML = '';
        }

        async function runTests() {
            clearLog();
            log('Starting API diagnostic tests...', 'info');

            // Test 1: Basic API connectivity
            log('TEST 1: Basic API connectivity (fetching cancer types list)...', 'info');
            try {
                const response = await fetch(`${API_BASE}/cancer-types?projection=SUMMARY`, {
                    headers: { 'Accept': 'application/json' }
                });
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Retrieved ${data.length} cancer types`, 'success');
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
                log('This might be a CORS issue. Check browser console for more details.', 'error');
            }

            // Test 2: Fetch a specific study
            log('', 'info');
            log('TEST 2: Fetching study info for brca_tcga...', 'info');
            try {
                const response = await fetch(`${API_BASE}/studies/brca_tcga`, {
                    headers: { 'Accept': 'application/json' }
                });
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Study "${data.name}" has ${data.allSampleCount} samples`, 'success');
                    logData('Study data', data);
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
            }

            // Test 3: Fetch molecular profiles
            log('', 'info');
            log('TEST 3: Fetching molecular profiles for brca_tcga...', 'info');
            try {
                const response = await fetch(`${API_BASE}/studies/brca_tcga/molecular-profiles`, {
                    headers: { 'Accept': 'application/json' }
                });
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Found ${data.length} molecular profiles`, 'success');
                    
                    const mutProfile = data.find(p => p.molecularAlterationType === 'MUTATION_EXTENDED');
                    const cnaProfile = data.find(p => p.molecularAlterationType === 'COPY_NUMBER_ALTERATION');
                    
                    if (mutProfile) {
                        log(`  - Mutation profile: ${mutProfile.molecularProfileId}`, 'success');
                    }
                    if (cnaProfile) {
                        log(`  - CNA profile: ${cnaProfile.molecularProfileId}`, 'success');
                    }
                    
                    logData('Profiles', data.map(p => ({ id: p.molecularProfileId, type: p.molecularAlterationType })));
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
            }

            // Test 4: Fetch samples
            log('', 'info');
            log('TEST 4: Fetching samples for brca_tcga...', 'info');
            try {
                const response = await fetch(`${API_BASE}/studies/brca_tcga/samples?projection=ID`, {
                    headers: { 'Accept': 'application/json' }
                });
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Found ${data.length} samples`, 'success');
                    logData('First 5 samples', data.slice(0, 5));
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
            }

            // Test 5: Fetch mutations using POST
            log('', 'info');
            log('TEST 5: Fetching mutations using POST request...', 'info');
            try {
                const response = await fetch(
                    `${API_BASE}/molecular-profiles/brca_tcga_mutations/mutations?projection=SUMMARY`,
                    {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            sampleListId: 'brca_tcga_all'
                        })
                    }
                );
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Found ${data.length} mutations`, 'success');
                    
                    // Count genes
                    const geneCounts = {};
                    data.forEach(m => {
                        const gene = m.gene?.hugoGeneSymbol || 'Unknown';
                        if (!geneCounts[gene]) geneCounts[gene] = new Set();
                        geneCounts[gene].add(m.sampleId);
                    });
                    
                    const topGenes = Object.entries(geneCounts)
                        .map(([gene, samples]) => ({ gene, count: samples.size }))
                        .sort((a, b) => b.count - a.count)
                        .slice(0, 10);
                    
                    log(`Top 10 mutated genes:`, 'success');
                    logData('Top genes', topGenes);
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
            }

            // Test 6: Alternative - fetch mutations using GET with gene list
            log('', 'info');
            log('TEST 6: Alternative mutation fetch using genes endpoint...', 'info');
            try {
                const response = await fetch(
                    `${API_BASE}/molecular-profiles/brca_tcga_mutations/mutation-genes?projection=SUMMARY`,
                    {
                        headers: { 'Accept': 'application/json' }
                    }
                );
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Found ${data.length} mutated genes`, 'success');
                    logData('Top 10 genes', data.slice(0, 10));
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
            }

            // Test 7: Clinical data
            log('', 'info');
            log('TEST 7: Fetching clinical data...', 'info');
            try {
                const response = await fetch(
                    `${API_BASE}/studies/brca_tcga/clinical-data?clinicalDataType=PATIENT&projection=DETAILED`,
                    {
                        headers: { 'Accept': 'application/json' }
                    }
                );
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ SUCCESS: Found ${data.length} clinical data points`, 'success');
                    
                    // Get unique attributes
                    const attrs = [...new Set(data.map(d => d.clinicalAttributeId))];
                    log(`Available clinical attributes: ${attrs.length}`, 'info');
                    logData('Attributes', attrs);
                } else {
                    const text = await response.text();
                    log(`✗ FAILED: ${text}`, 'error');
                }
            } catch (e) {
                log(`✗ ERROR: ${e.message}`, 'error');
            }

            log('', 'info');
            log('=== TESTS COMPLETE ===', 'info');
            log('Please share the results above so I can diagnose the issue.', 'info');
        }
    </script>
</body>
</html>
