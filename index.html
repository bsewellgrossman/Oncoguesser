<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoWordle - Cancer Genomics Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧬 OncoWordle</h1>
            <p class="subtitle">Guess the cancer type from its genomic profile</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="number" id="gamesPlayed">0</div>
                <div class="label">Played</div>
            </div>
            <div class="stat-item">
                <div class="number" id="gamesWon">0</div>
                <div class="label">Won</div>
            </div>
            <div class="stat-item">
                <div class="number" id="winPercent">0%</div>
                <div class="label">Win %</div>
            </div>
            <div class="stat-item">
                <div class="number" id="currentStreak">0</div>
                <div class="label">Streak</div>
            </div>
        </div>

        <div id="gameContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading genomic profile...</p>
            </div>
        </div>
    </div>

    <!-- Load scripts in order: data first, then game logic -->
    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>
